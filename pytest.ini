[pytest]
# pythonpath puts the project root on sys.path so the tests can import engine,
# strategies and analytics the same way the scripts do. Without it pytest would
# only add tests/ itself, and every import of a project module would fail.
#
# Declaring it here rather than through a conftest.py sys.path edit keeps the
# mechanism visible: anyone reading this file can see why the imports resolve.
pythonpath = .

testpaths = tests

# Fail on an unregistered marker rather than silently skipping the filter, which
# otherwise turns a typo in a marker name into a test that never runs.
addopts = --strict-markers
